name: Check portfolio

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check the production app in Chromium
        env:
          NODE_ENV: production
          PORT: 3001
          TEST_BASE_URL: http://127.0.0.1:3001
          BROWSER_ARTIFACTS: test-results/browser
        run: |
          node --input-type=module > /tmp/portfolio-server.log 2>&1 <<'NODE' &
          import { startLocalMongo } from './scripts/mongodb.js';
          const mongo = await startLocalMongo();
          process.env.MONGODB_URI = mongo.getUri('portfolio_browser');
          await import('./server/index.js');
          NODE
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/portfolio-server.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3001/api/health > /dev/null
          npm run test:browser
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser
          path: test-results/browser
          if-no-files-found: ignore
